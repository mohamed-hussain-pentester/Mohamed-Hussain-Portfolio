<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      document.documentElement.classList.add("page-loading");
      document.documentElement.dataset.pageLoaderStartedAt = Date.now();
    </script>

    <title>Thank You | Mohamed Hussain</title>

    <!-- Redirect after 5 seconds -->
    <meta http-equiv="refresh" content="5;url=index.html" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="assets/images/codespaces-svgrepo-com.svg"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-loader" aria-hidden="false">
      <div class="cv-loader" role="status" aria-live="polite">
        <div class="loader-icon" aria-hidden="true">
          <span class="loader-icon-text">&gt;_</span>
        </div>
        <div class="loader-content">
          <div class="loader-title">
            <span class="loader-prompt">&gt;</span>
            LOADING_CONFIRMATION
            <span class="loader-dots" aria-hidden="true">
              <span>.</span>
              <span>.</span>
              <span>.</span>
            </span>
          </div>
          <p class="loader-status">Preparing confirmation...</p>
          <div class="loader-progress" aria-hidden="true">
            <div class="loader-progress-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <main class="thank-you-page">
      <div class="thank-you-card">
        <div class="success-icon">✓</div>

        <h1>Message Sent Successfully!</h1>

        <p>
          Thank you for contacting me. Your message has been received
          successfully.
        </p>

        <p class="redirect-text">
          You will be redirected to the portfolio in
          <span id="countdown">5</span> seconds...
        </p>

        <a href="index.html" class="back-btn"> Back to Portfolio </a>
      </div>
    </main>

    <script>
      let seconds = 5;
      const countdown = document.getElementById("countdown");

      const timer = setInterval(() => {
        seconds--;
        countdown.textContent = seconds;

        if (seconds <= 0) {
          clearInterval(timer);
          window.location.href = "index.html";
        }
      }, 1000);
    </script>
    <div class="mouse-glow"></div>
    <script src="script.js"></script>
  </body>
</html>
