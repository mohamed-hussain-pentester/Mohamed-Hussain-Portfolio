<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Mohamed Hussain | CV</title>

    <!-- PDF.js -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
      type="module"
    ></script>
  </head>

  <body>
    <!-- =================================
         NAVBAR
    ================================= -->

    <header class="site-header">
      <nav class="wrap nav" aria-label="Primary navigation">
        <!-- Logo + Name -->
        <a
          href="index.html#home"
          class="brand"
          aria-label="Mohamed Hussain home"
        >
          <div class="logo">
            <img src="assets/images/Portfolio.png" alt="Mohamed Hussain Logo" />
          </div>

          <span class="brand-name"> Mohamed Hussain </span>
        </a>

        <!-- Actions -->
        <div class="nav-actions">
          <a class="btn btn-primary" href="contact.html"> Let's Connect </a>

          <a
            href="index.html#home"
            class="btn btn-secondary"
            aria-label="Return to home page"
          >
            Home
          </a>

          <button
            class="mobile-menu-button"
            id="mobileMenuButton"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
          >
            ☰
          </button>
        </div>
      </nav>
    </header>

    <!-- =================================
         CV TOOLBAR
    ================================= -->

    <div class="cv-toolbar">
      <button class="btn btn-secondary" id="zoomOut" type="button">
        − Zoom
      </button>

      <button class="btn btn-secondary" id="zoomIn" type="button">
        + Zoom
      </button>

      <button class="btn btn-secondary" id="printButton" type="button">
        🖨 Print CV
      </button>

      <a
        class="btn btn-primary"
        href="assets/certificates/MOHAMED_HUSSAIN_CV.pdf"
        download="MOHAMED_HUSSAIN_CV.pdf"
      >
        ↓ Download CV
      </a>
    </div>

    <!-- =================================
         PDF VIEWER
    ================================= -->

    <main class="viewer-container">
      <div id="pdf-container">
        <p id="loading">Loading CV...</p>

        <div id="error">
          <strong> Unable to display the CV. </strong>

          Please use the Download CV button to open the PDF directly.
        </div>
      </div>
    </main>

    <!-- =================================
         PDF.JS
    ================================= -->

    <script type="module">
      import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

      const pdfUrl = "assets/certificates/MOHAMED_HUSSAIN_CV.pdf";

      const container = document.getElementById("pdf-container");

      const loading = document.getElementById("loading");

      const error = document.getElementById("error");

      const zoomIn = document.getElementById("zoomIn");

      const zoomOut = document.getElementById("zoomOut");

      const printButton = document.getElementById("printButton");

      const mobileMenuButton = document.getElementById("mobileMenuButton");

      const mobileMenu = document.getElementById("mobileMenu");

      let pdf = null;

      let scale = 1.3;

      /* =================================
         LOAD PDF
      ================================= */

      async function loadPDF() {
        try {
          pdf = await pdfjsLib.getDocument(pdfUrl).promise;

          loading.remove();

          for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
            await renderPage(pageNumber);
          }
        } catch (err) {
          console.error("PDF loading error:", err);

          loading.remove();

          error.style.display = "block";
        }
      }

      /* =================================
         RENDER PAGE
      ================================= */

      async function renderPage(pageNumber) {
        const page = await pdf.getPage(pageNumber);

        const viewport = page.getViewport({
          scale: scale,
        });

        const canvas = document.createElement("canvas");

        canvas.className = "pdf-page";

        const context = canvas.getContext("2d");

        canvas.width = viewport.width;

        canvas.height = viewport.height;

        await page.render({
          canvasContext: context,

          viewport: viewport,
        }).promise;

        container.appendChild(canvas);
      }

      /* =================================
         RELOAD PDF
      ================================= */

      async function reloadPDF() {
        if (!pdf) return;

        const canvases = container.querySelectorAll(".pdf-page");

        canvases.forEach((canvas) => canvas.remove());

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
          await renderPage(pageNumber);
        }
      }

      /* =================================
         ZOOM IN
      ================================= */

      zoomIn.addEventListener("click", async () => {
        if (scale >= 2.5) return;

        scale += 0.2;

        await reloadPDF();
      });

      /* =================================
         ZOOM OUT
      ================================= */

      zoomOut.addEventListener("click", async () => {
        if (scale <= 0.6) return;

        scale -= 0.2;

        await reloadPDF();
      });

      /* =================================
         PRINT
      ================================= */

      printButton.addEventListener("click", () => {
        window.print();
      });

      /* =================================
         MOBILE MENU
      ================================= */

      mobileMenuButton.addEventListener("click", () => {
        const isOpen = mobileMenu.classList.toggle("open");

        mobileMenuButton.setAttribute("aria-expanded", isOpen);
      });

      /* =================================
         CLOSE MOBILE MENU
         AFTER CLICK
      ================================= */

      mobileMenu.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", () => {
          mobileMenu.classList.remove("open");

          mobileMenuButton.setAttribute("aria-expanded", "false");
        });
      });

      /* =================================
         START
      ================================= */

      loadPDF();
    </script>
    <div class="mouse-glow"></div>
    <script src="script.js"></script>
  </body>
</html>
